[package]
name = "truefix-okx-client"
version = "0.1.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Native, typed OKX V5 REST and WebSocket client for TrueFix."
publish = true

[dependencies]
base64.workspace = true
futures-util.workspace = true
hmac.workspace = true
reqwest.workspace = true
rustls.workspace = true
rust_decimal = { workspace = true, features = ["serde-with-str"] }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Reproduce downstream feature unification so order wire tests fail if a
# Decimal field ever falls back to rust_decimal's numeric serializer.
rust_decimal = { workspace = true, features = ["serde-float"] }

[lints]
workspace = true
